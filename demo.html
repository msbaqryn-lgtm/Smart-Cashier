<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سمارت كاشير | عرض تجريبي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container header-box">
            <a href="index.html" class="logo">سمارت كاشير</a>
            <nav>
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="products.html">المنتجات</a></li>
                    <li><a href="pricing.html">الباقات</a></li>
                    <li><a href="about.html">من نحن</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                    <li><a href="demo.html" class="active">عرض تجريبي</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>اطلب عرضاً تجريبياً الآن</h1>
                <p>املأ النموذج وسيتواصل معك فريقنا لتحديد موعد لتجربة النظام.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="form-box">
                    <form action="#" method="post">
                        <label for="name">الاسم الكامل</label>
                        <input type="text" id="name" name="name" placeholder="أدخل اسمك الثلاثي" required>

                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>

                        <label for="phone">رقم الهاتف</label>
                        <input type="tel" id="phone" name="phone" placeholder="أدخل رقم هاتفك للتواصل" required>

                        <label for="service">الخدمة المطلوبة</label>
                        <select id="service" name="service" required>
                            <option value="">-- اختر الخدمة أو الباقة --</option>
                            <option value="basic">الباقة الأساسية (99$)</option>
                            <option value="pro">الباقة الاحترافية (199$)</option>
                            <option value="enterprise">باقة الشركات (399$)</option>
                            <option value="hardware">أجهزة الكاشير وملحقاتها</option>
                        </select>

                        <label for="message">ملاحظات إضافية</label>
                        <textarea id="message" name="message" rows="4" placeholder="اكتب أي استفسارات أو متطلبات خاصة بنشاطك التجاري"></textarea>

                        <button type="submit" class="btn">إرسال الطلب</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>سمارت كاشير - تريم، حضرموت | الهاتف: 779375534</p>
            <p>تصميم وتطوير: مجموعة كود كرو (عمر صبري - محمد باقرين) &copy; 2026</p>
        </div>
    </footer>

</body>
</html>
